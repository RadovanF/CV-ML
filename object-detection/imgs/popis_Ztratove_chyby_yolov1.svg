<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="588" viewBox="0 0 1020 588" font-family="DejaVu Sans, Arial, sans-serif">
  <rect x="0" y="0" width="1020" height="588" fill="#ffffff"/>

  <text x="36" y="28" font-size="17" font-weight="bold" fill="#222">YOLOv1 – které části ztrátové funkce se počítají pro který box</text>
  <text x="36" y="50" font-size="14" fill="#444">Střed zájmového objektu z trénovací množiny padne do buňky [3,3].</text>
  <text x="36" y="70" font-size="14" fill="#444">IoU se spočítá z predikovaného boxu a GT boxu – síť ho nevrací.</text>

  <g transform="translate(0,46)">

  <!-- Obrázek 448x448 s mřížkou 7x7 -->
  <g transform="translate(36,56)">
    <rect x="0" y="0" width="448" height="448" fill="#f4f4f4" stroke="#999"/>
    <!-- zvýrazněná buňka [3,3] -->
    <rect x="192" y="192" width="64" height="64" fill="#fff1a8" stroke="#c9a800" stroke-width="2"/>
    <!-- mřížka -->
    <g stroke="#bbb" stroke-width="1">
      <line x1="64" y1="0" x2="64" y2="448"/><line x1="128" y1="0" x2="128" y2="448"/>
      <line x1="192" y1="0" x2="192" y2="448"/><line x1="256" y1="0" x2="256" y2="448"/>
      <line x1="320" y1="0" x2="320" y2="448"/><line x1="384" y1="0" x2="384" y2="448"/>
      <line x1="0" y1="64" x2="448" y2="64"/><line x1="0" y1="128" x2="448" y2="128"/>
      <line x1="0" y1="192" x2="448" y2="192"/><line x1="0" y1="256" x2="448" y2="256"/>
      <line x1="0" y1="320" x2="448" y2="320"/><line x1="0" y1="384" x2="448" y2="384"/>
    </g>
    <!-- indexy sloupců a řádků -->
    <g font-size="12" fill="#666" text-anchor="middle">
      <text x="32" y="-6">0</text><text x="96" y="-6">1</text><text x="160" y="-6">2</text>
      <text x="224" y="-6" font-weight="bold" fill="#8a7300">3</text>
      <text x="288" y="-6">4</text><text x="352" y="-6">5</text><text x="416" y="-6">6</text>
      <text x="-14" y="36">0</text><text x="-14" y="100">1</text><text x="-14" y="164">2</text>
      <text x="-14" y="228" font-weight="bold" fill="#8a7300">3</text>
      <text x="-14" y="292">4</text><text x="-14" y="356">5</text><text x="-14" y="420">6</text>
    </g>

    <!-- GT box -->
    <rect x="144" y="166" width="160" height="128" fill="none" stroke="#2e7d32" stroke-width="3"/>
    <circle cx="224" cy="230" r="5" fill="#2e7d32"/>
    <rect x="28" y="301" width="166" height="18" fill="#ffffff" fill-opacity="0.9"/>
    <text x="32" y="314" font-size="13" font-weight="bold" fill="#2e7d32">GT box (např. automobil)</text>

    <!-- Box 1 (IoU ~0.6) -->
    <rect x="155" y="153" width="170" height="110" fill="none" stroke="#1565c0" stroke-width="3" stroke-dasharray="8 4"/>
    <rect x="52" y="134" width="144" height="17" fill="#ffffff" fill-opacity="0.9"/>
    <text x="192" y="147" font-size="13" font-weight="bold" fill="#1565c0" text-anchor="end">Box 1 · IoU s GT = 0.6</text>

    <!-- Box 2 (IoU ~0.2) -->
    <rect x="200" y="136" width="40" height="200" fill="none" stroke="#ef6c00" stroke-width="3" stroke-dasharray="3 3"/>
    <text x="246" y="352" font-size="13" font-weight="bold" fill="#ef6c00">Box 2 · IoU s GT = 0.2</text>
  </g>

  <!-- Pravý panel: co se počítá pro který box -->
  <g font-size="14" fill="#222">
    <!-- Box 1 -->
    <rect x="520" y="56" width="480" height="132" rx="8" fill="#e8f0fb" stroke="#1565c0" stroke-width="2"/>
    <text x="536" y="82" font-size="15" font-weight="bold" fill="#1565c0">Box 1 · IoU s GT = 0.6 → ZODPOVĚDNÝ</text>
    <g transform="translate(536,97)"><path d="M0 6 L5 11 L14 0" fill="none" stroke="#2e7d32" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g>
    <text x="558" y="108">chyba x, y (část A, × λ_coord)</text>
    <g transform="translate(536,121)"><path d="M0 6 L5 11 L14 0" fill="none" stroke="#2e7d32" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g>
    <text x="558" y="132">chyba w, h (část B, × λ_coord)</text>
    <g transform="translate(536,145)"><path d="M0 6 L5 11 L14 0" fill="none" stroke="#2e7d32" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g>
    <text x="558" y="156">chyba confidence (část C)</text>
    <text x="558" y="178" fill="#444">predikovaná confidence např. 0.9, cíl (realita) = IoU = 0.6</text>

    <!-- Box 2 -->
    <rect x="520" y="198" width="480" height="116" rx="8" fill="#fdf0e4" stroke="#ef6c00" stroke-width="2"/>
    <text x="536" y="226" font-size="15" font-weight="bold" fill="#ef6c00">Box 2 · IoU s GT = 0.2 → nezodpovědný</text>
    <g transform="translate(536,241)"><path d="M1 1 L12 12 M12 1 L1 12" fill="none" stroke="#c62828" stroke-width="2.5" stroke-linecap="round"/></g>
    <text x="558" y="252">chyba x, y ani w, h se nepočítá</text>
    <g transform="translate(536,265)"><path d="M0 6 L5 11 L14 0" fill="none" stroke="#2e7d32" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g>
    <text x="558" y="276">jen chyba confidence (část D, × λ_noobj)</text>
    <text x="558" y="298" fill="#444">predikovaná confidence např. 0.3, cíl = 0</text>

    <!-- Buňka [3,3] -->
    <rect x="520" y="324" width="480" height="84" rx="8" fill="#fff8d6" stroke="#c9a800" stroke-width="2"/>
    <text x="536" y="350" font-size="15" font-weight="bold" fill="#8a7300">Buňka [3,3] – obsahuje střed objektu</text>
    <g transform="translate(536,365)"><path d="M0 6 L5 11 L14 0" fill="none" stroke="#2e7d32" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g>
    <text x="558" y="376">třída objektu (one-hot) – jednou pro celou buňku (část E)</text>

    <!-- Ostatní buňky -->
    <rect x="520" y="418" width="480" height="84" rx="8" fill="#f2f2f2" stroke="#999" stroke-width="2"/>
    <text x="536" y="444" font-size="15" font-weight="bold" fill="#555">Ostatních 48 buněk – žádný střed objektu</text>
    <g transform="translate(536,459)"><path d="M0 6 L5 11 L14 0" fill="none" stroke="#2e7d32" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g>
    <text x="558" y="470">oba boxy: chyba confidence, cíl = 0 (část D, × λ_noobj)</text>
  </g>
  </g>
</svg>
